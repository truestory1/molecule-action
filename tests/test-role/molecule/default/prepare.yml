---
- name: Prepare
  hosts: all
  # become: true
  gather_facts: false
  tasks:

    - name: Install Python3
      ansible.builtin.raw: apt-get update -qq && apt-get install -y -qq python3
      changed_when: true

    - name: Install required dependencies
      ansible.builtin.package:
        name:
          - sudo
        state: present

    - name: Ensure /etc/shadow permissions
      ansible.builtin.raw: chmod 0400 /etc/shadow
      changed_when: false
