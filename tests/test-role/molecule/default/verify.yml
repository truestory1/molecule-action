---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check /tmp/ansible-test.txt exists
      ansible.builtin.stat:
        path: /tmp/ansible-test.txt
      register: ansible_test_file

    - name: Assert /tmp/ansible-test.txt exists
      ansible.builtin.assert:
        that: ansible_test_file.stat.exists
        fail_msg: "/tmp/ansible-test.txt does not exist"
