---
lint: |
  set -e
  yamllint .
  ansible-lint -f full
dependency:
  name: galaxy
  options:
    # ignore-certs: True
    # ignore-errors: True
    role-file: requirements.yml
    requirements-file: requirements.yml
    force: false

driver:
  name: containers
platforms:
  - name: testrole01
    pre_build_image: true
    # renovate: datasource=docker
    image: ubuntu:24.04
  - name: testrole02
    pre_build_image: true
    # renovate: datasource=docker
    image: rockylinux/rockylinux:10-ubi-init
    privileged: true
    command: "/usr/sbin/init"
    cgroupns_mode: host
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - "/sys/fs/cgroup:/sys/fs/cgroup:rw"
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: "$MOLECULE_PROJECT_DIRECTORY/.."
verifier:
  name: ansible
