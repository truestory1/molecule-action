name: CI-PR

on:
  pull_request:
  workflow_dispatch:

env:
  PLATFORMS: linux/amd64 #,linux/arm64
  REGISTRY: ghcr.io

jobs:
  ci-pr:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        # with:
        #   path: ${{ github.repository }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry: ${{ env.REGISTRY }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          file: Containerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:testing-${{ github.event.pull_request.number }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.PLATFORMS }}
          # provenance: false

      - name: Test - ansible
        run: |
          docker run ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:testing-${{ github.event.pull_request.number }} ansible --version

      - name: Test - molecule
        run: |
          docker run ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:testing-${{ github.event.pull_request.number }} molecule --version

      - name: Test - molecule converge (containers)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspace \
            -e INPUT_MOLECULE_WORKING_DIR="tests/test-role" \
            -e INPUT_MOLECULE_COMMAND="converge" \
            -e ANSIBLE_ASYNC_DIR="/tmp/.ansible_async" \
            -e ANSIBLE_FORCE_COLOR="1" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:testing-${{ github.event.pull_request.number }}

      - name: Test - molecule converge (docker)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspace \
            -e INPUT_MOLECULE_WORKING_DIR="tests/test-role" \
            -e INPUT_MOLECULE_COMMAND="converge" \
            -e INPUT_MOLECULE_ARGS="--scenario-name docker" \
            -e ANSIBLE_ASYNC_DIR="/tmp/.ansible_async" \
            -e ANSIBLE_FORCE_COLOR="1" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:testing-${{ github.event.pull_request.number }}

      - name: Start podman socket
        run: sudo systemctl start podman.socket

      - name: Test - molecule converge (podman)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /run/podman/podman.sock:/run/podman/podman.sock \
            -w /workspace \
            -e CONTAINER_HOST="unix:///run/podman/podman.sock" \
            -e INPUT_MOLECULE_WORKING_DIR="tests/test-role" \
            -e INPUT_MOLECULE_COMMAND="converge" \
            -e INPUT_MOLECULE_ARGS="--scenario-name podman" \
            -e ANSIBLE_ASYNC_DIR="/tmp/.ansible_async" \
            -e ANSIBLE_FORCE_COLOR="1" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:testing-${{ github.event.pull_request.number }}
