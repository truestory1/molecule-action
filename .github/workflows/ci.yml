name: CI-PR

on:
  pull_request:
  workflow_dispatch:

env:
  PLATFORMS: linux/amd64 #,linux/arm64
  REGISTRY: ghcr.io

jobs:
  ci-pr:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        # with:
        #   path: ${{ github.repository }}

      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry: ${{ env.REGISTRY }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          file: Containerfile
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:testing-${{ github.event.pull_request.number }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ env.PLATFORMS }}
          # provenance: false

      - name: Test - ansible
        run: |
          docker run ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:testing-${{ github.event.pull_request.number }} ansible --version

      - name: Test - molecule
        run: |
          docker run ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:testing-${{ github.event.pull_request.number }} molecule --version

      - name: Test - molecule converge
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspace \
            -e INPUT_MOLECULE_WORKING_DIR="tests/test-role" \
            -e INPUT_MOLECULE_COMMAND="converge" \
            -e ANSIBLE_ASYNC_DIR="/tmp/.ansible_async" \
            -e ANSIBLE_FORCE_COLOR="1" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:testing-${{ github.event.pull_request.number }}
