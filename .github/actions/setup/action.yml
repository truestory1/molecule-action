name: Setup Docker Build Environment
description: Shared setup for Docker image build workflows

inputs:
  registry:
    description: Container registry
    required: true
  token:
    description: GitHub token for registry login
    required: true

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

    - name: Set up Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

    - name: Set up variable repository name
      run: echo "IMAGE_NAME=${{ github.repository }}" >> $GITHUB_ENV
      shell: bash

    - name: Image registry login
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
