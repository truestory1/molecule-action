name: Setup Docker Build Environment
description: Shared setup for Docker image build workflows

inputs:
  registry:
    description: Container registry
    required: true
  token:
    description: GitHub token for registry login
    required: true

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

    - name: Set up Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - name: Set up variable repository name
      run: echo "IMAGE_NAME=${{ github.repository }}" >> $GITHUB_ENV
      shell: bash

    - name: Image registry login
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
