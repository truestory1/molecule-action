name: Setup Docker Build Environment
description: Shared setup for Docker image build workflows

inputs:
  registry:
    description: Container registry
    required: true
  token:
    description: GitHub token for registry login
    required: true

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4

    - name: Set up Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

    - name: Set up variable repository name
      run: echo "IMAGE_NAME=${{ github.repository }}" >> $GITHUB_ENV
      shell: bash

    - name: Image registry login
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
