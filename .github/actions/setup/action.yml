name: Setup Docker Build Environment
description: Shared setup for Docker image build workflows

inputs:
  registry:
    description: Container registry
    required: true
  token:
    description: GitHub token for registry login
    required: true

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

    - name: Set up Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

    - name: Set up variable repository name
      run: echo "IMAGE_NAME=${{ github.repository }}" >> $GITHUB_ENV
      shell: bash

    - name: Image registry login
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
